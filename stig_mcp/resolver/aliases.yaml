# VCSA is the vCenter Server Appliance, which is the vCenter STIG plus the nine component
# STIGs whose own titles read "vCenter Appliance ... Envoy" and so on. Only the PARENT is
# aliased: the nine components already score 100.0 on the `vcsa` token their own ids carry,
# so this adds the one benchmark a caller naming the appliance would otherwise not see, and
# the specificity tiebreak then ranks the parent first because it names fewest tokens the
# query did not. `vcsa 8` rather than `vcsa 8.0` because _alias_ids is a subset test and
# normalize splits 8.0 into {8, 0}: the shorter pattern covers both 'VCSA 8.0' and 'VCSA 8'.
# Same convention as CAN_Ubuntu_22-04_LTS_STIG carrying both spellings, in one pattern
# instead of two.
#
# Do not add the spelled-out 'vcenter server appliance 8.0'. The two spellings are not
# symmetric: components carry `vcsa` in their ids, so under the acronym the parent JOINS
# their tied tier, but they carry none of vcenter/server/appliance, so under the spelled-out
# pattern the parent scores 100.0 alone and EVICTS them. That would cost
# 'vCenter Server Appliance 8.0 Photon OS' its Photon hit, the Envoy query its Envoy hit, and
# turn 'vCenter Server Appliance 6.7 upgrading to 8.0' from silence into a confident 8.0
# answer, to gain one query: bare 'vCenter Server Appliance 8.0', which stays silent here.
# No corpus-derived sweep can retest this: the phrase appears in no title and no stig_id.
VMW_vSphere_8-0_vCenter_STIG:
  - "vcsa 8"
