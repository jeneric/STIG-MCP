# Which STIG major applies to which product build.
#
# Source:  U_VMW_vSphere_8-0_Overview.pdf, section 1.2 "Support and Compatibility",
#          shipped inside U_VMW_vSphere_8-0_Y26M07_STIG.zip in the SRG-STIG Library.
#          "The VMware vSphere 8.0 V2 STIGs are intended for vSphere 8 Update 3 builds
#          only, and application of this guidance prior to Update 3 is not supported.
#          If guidance is needed for Update 2 builds, reference the VMware vSphere 8.0
#          V1R1 STIGs included as supplemental documentation."
# Verified against: SRG-STIG Library July 2026.
#
# Re-check this file on every library refresh. See docs/operations.md.
#
# id_pattern is a regex, not a prefix, and that is load bearing: DISA spells one of the
# twelve vSphere 8.0 benchmarks with a dot (VMW_vSphere_8.0_Virtual_Machine_STIG) and the
# other eleven with a hyphen. A plain prefix silently leaves that one unfiltered.
#
# build_pattern must define a named group "n" capturing the update number. A match where
# "n" did not participate, which is how GA matches, means update 0.
#
# thresholds must include one with min: 0, so no build can fall through unmatched. Use
# version: null where the product had no official STIG at those builds.

VMW_vSphere_8_0:
  id_pattern: '^VMW_vSphere_8[-.]0_'
  build_pattern: '\b(?:u(?:pdate\s*)?(?P<n>\d+)[a-z]?|ga)\b'
  source: 'U_VMW_vSphere_8-0_Overview.pdf section 1.2'
  verified_against: 'SRG-STIG Library July 2026'
  thresholds:
    - min: 3
      version: "2"
    - min: 2
      version: "1"
    - min: 0
      version: null
